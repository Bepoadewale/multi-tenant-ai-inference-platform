global:
  scrape_interval: 5s

scrape_configs:
  - job_name: inference-gateways
    static_configs:
      - targets: [gateway-1:8080, gateway-2:8080]
  - job_name: governed-remediation-control
    static_configs:
      - targets: [remediation-control:8080]
  - job_name: delegated-agent-tools
    static_configs:
      - targets: [agent-tools:8080]
  - job_name: developer-self-service
    static_configs:
      - targets: [developer-self-service:8080]
  - job_name: edge-adapter-control
    static_configs:
      - targets: [edge-control:8080]
  - job_name: edge-device-agents
    static_configs:
      - targets: [edge-device-search:8080, edge-device-constrained:8080]
