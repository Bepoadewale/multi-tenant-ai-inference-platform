apiVersion: v1
kind: ServiceAccount
metadata: {name: inference-gateway}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: inference-gateway}
spec:
  replicas: {{ .Values.replicas }}
  selector: {matchLabels: {app: inference-gateway}}
  template:
    metadata: {labels: {app: inference-gateway}}
    spec:
      serviceAccountName: inference-gateway
      securityContext: {seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports: [{containerPort: 8080}]
          securityContext: {runAsNonRoot: true, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe: {httpGet: {path: /healthz, port: 8080}}
          livenessProbe: {httpGet: {path: /healthz, port: 8080}}
---
apiVersion: v1
kind: Service
metadata: {name: inference-gateway, labels: {app: inference-gateway}}
spec: {selector: {app: inference-gateway}, ports: [{port: 8080, targetPort: 8080}]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny}
spec: {podSelector: {}, policyTypes: [Ingress, Egress]}
---
apiVersion: v1
kind: ResourceQuota
metadata: {name: inference-quota}
spec: {hard: {requests.cpu: "4", requests.memory: 8Gi, pods: "20"}}
