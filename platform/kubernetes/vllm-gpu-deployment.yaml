apiVersion: apps/v1
kind: Deployment
metadata: {name: vllm-chat-default, namespace: inference}
spec:
  replicas: 1
  selector: {matchLabels: {app: vllm-chat-default}}
  template:
    metadata: {labels: {app: vllm-chat-default}}
    spec:
      nodeSelector: {accelerator: nvidia}
      tolerations: [{key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}]
      terminationGracePeriodSeconds: 120
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          args: ["--model", "meta-llama/Llama-3.2-3B-Instruct", "--max-model-len", "8192", "--gpu-memory-utilization", "0.90", "--max-num-seqs", "32", "--enable-prefix-caching"]
          resources: {limits: {nvidia.com/gpu: "1", cpu: "4", memory: 32Gi}, requests: {cpu: "2", memory: 16Gi}}
          ports: [{containerPort: 8000}]
          readinessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 60, periodSeconds: 10}
