name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions: {contents: read}
jobs:
  python:
    runs-on: ubuntu-24.04
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_TEST_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: make container-dependencies-validate
      - run: make install
      - run: make container-dependencies-audit
      - run: make lint && make test && docker compose config --quiet
      - run: make gpu-compose-config && make gpu-benchmark-plan && make gpu-evaluation-plan && make gpu-cuda-plan
      - run: make audit
  manifests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive infrastructure/terraform
      - run: make terraform-validate
      - uses: azure/setup-helm@v4
      - run: make cloud-delivery-validate
  gpu-observability:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: make gpu-observability-validate
  ansible:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --require-hashes -r infrastructure/ansible/requirements.lock
      - run: make gpu-ansible-validate
  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: make container-dependencies-validate
      - run: docker build -t inference-gateway:ci -f gateway/Dockerfile .
      - name: Install checksum-verified Trivy
        env:
          TRIVY_VERSION: v0.76.2
          TRIVY_SHA256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf
        run: |
          archive="trivy_${TRIVY_VERSION#v}_Linux-64bit.tar.gz"
          url="https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VERSION}/${archive}"
          curl --fail --location --retry 3 --silent --show-error "$url" --output "$RUNNER_TEMP/$archive"
          printf '%s  %s\n' "$TRIVY_SHA256" "$RUNNER_TEMP/$archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/trivy"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/trivy" trivy
          "$RUNNER_TEMP/trivy/trivy" --version
          echo "$RUNNER_TEMP/trivy" >> "$GITHUB_PATH"
      - name: Scan the repository with Trivy
        run: trivy fs --severity HIGH,CRITICAL --exit-code 1 .
      - uses: anchore/sbom-action@v0
        with: {path: ., format: spdx-json}
  local-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: make install
      - run: make bootstrap-local
      - if: failure()
        run: docker compose ps -a && docker compose logs --no-color
      - id: smoke
        run: make smoke
      - if: failure() && steps.smoke.outcome == 'failure'
        run: docker compose ps -a && docker compose logs --no-color
      - run: make demo-flagship
      - run: make verify
      - if: always()
        run: make clean-local
