name: ci
on: [push, pull_request]
permissions: {contents: read}
jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: make install
      - run: make lint && make test && docker compose config --quiet
      - run: make audit
  manifests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive infrastructure/terraform
      - run: terraform -chdir=infrastructure/terraform/environments/aws init -backend=false && terraform -chdir=infrastructure/terraform/environments/aws validate
      - uses: azure/setup-helm@v4
      - run: helm lint platform/helm/inference-platform
  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t inference-gateway:ci -f gateway/Dockerfile .
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: {scan-type: fs, scan-ref: ., severity: HIGH,CRITICAL, exit-code: "1"}
      - uses: anchore/sbom-action@v0
        with: {path: ., format: spdx-json}
  local-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: make install
      - run: make bootstrap-local
      - run: make smoke
      - run: make demo-local && make demo-overload && make demo-routing && make demo-metering && make demo-observability && make demo-failure && make demo-timeout && make demo-recovery
      - run: make verify
      - if: always()
        run: make clean-local
