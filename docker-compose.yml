name: multi-tenant-ai-inference-platform

services:
  mlflow:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    command:
      ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000", "--workers", "1", "--allowed-hosts", "localhost:5000,localhost:15010,127.0.0.1:5000,127.0.0.1:15010,mlflow:5000", "--backend-store-uri", "sqlite:////mlflow/mlflow.db", "--serve-artifacts", "--artifacts-destination", "/mlflow/artifacts"]
    volumes: ["./.local/mlflow:/mlflow"]
    ports: ["15010:5000"]
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:5000/health\")'"]
      interval: 3s
      timeout: 3s
      start_period: 30s
      retries: 60

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes: ["./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro"]
    ports: ["4318:4318"]

  tempo:
    image: grafana/tempo:2.7.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes: ["./observability/tempo.yaml:/etc/tempo.yaml:ro"]
    ports: ["3200:3200"]

  prometheus:
    image: prom/prometheus:v3.2.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - "./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
      - "inference-prometheus:/prometheus"
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.5.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - "./observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/local.yaml:ro"
      - "./observability/grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/local.yaml:ro"
      - "./dashboards:/var/lib/grafana/dashboards:ro"
      - "inference-grafana:/var/lib/grafana"
    ports: ["3002:3000"]

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - inference-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20

  runtime-v1:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    command: ["uvicorn", "inference_gateway.api.runtime:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      INFERENCE_RUNTIME_DELAY_SECONDS: "0.35"
      ONNX_MODEL_PATH: /app/models/tiny-intent-classifier.onnx
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")'"]
      interval: 3s
      timeout: 3s
      retries: 20

  runtime-v2:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    command: ["uvicorn", "inference_gateway.api.runtime:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      INFERENCE_RUNTIME_DELAY_SECONDS: "0.35"
      ONNX_MODEL_PATH: /app/models/tiny-intent-classifier-v2.onnx
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")'"]
      interval: 3s
      timeout: 3s
      retries: 20

  release-control:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    command: ["uvicorn", "inference_gateway.api.release:app", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      REDIS_URL: redis://redis:6379/0
      MLFLOW_TRACKING_URI: http://mlflow:5000
      RELEASE_DB_PATH: /release/release.db
      INFERENCE_AUTH_MODE: jwt
      JWT_PUBLIC_KEY_PATH: /run/identity/public.pem
      JWT_ISSUER: https://local.inference.platform
      JWT_AUDIENCE: inference-gateway
    volumes:
      - "./.local/release:/release"
      - "./.local/identity/public.pem:/run/identity/public.pem:ro"
    depends_on:
      mlflow: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports: ["8083:8080"]
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8080/healthz\")'"]
      interval: 3s
      timeout: 3s
      retries: 30

  remediation-control:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    command: ["uvicorn", "inference_gateway.api.remediation:app", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      REDIS_URL: redis://redis:6379/0
      RELEASE_DB_PATH: /release/release.db
      REMEDIATION_DB_PATH: /remediation/remediation.db
      # The production-safe controller default is 30 seconds. This local fixture
      # keeps the guard but uses one second so independent demos can run in sequence.
      REMEDIATION_COOLDOWN_SECONDS: "1"
      INFERENCE_AUTH_MODE: jwt
      JWT_PUBLIC_KEY_PATH: /run/identity/public.pem
      JWT_ISSUER: https://local.inference.platform
      JWT_AUDIENCE: inference-gateway
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    volumes:
      - "./.local/release:/release"
      - "./.local/remediation:/remediation"
      - "./.local/identity/public.pem:/run/identity/public.pem:ro"
    depends_on:
      release-control: {condition: service_healthy}
      redis: {condition: service_healthy}
      otel-collector: {condition: service_started}
    ports: ["8084:8080"]
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8080/healthz\")'"]
      interval: 3s
      timeout: 3s
      retries: 30

  agent-tools:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    command: ["uvicorn", "inference_gateway.api.agent_tools:app", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      REDIS_URL: redis://redis:6379/0
      AGENT_TOOLS_DB_PATH: /agent-tools/audit.db
      REMEDIATION_CONTROL_URL: http://remediation-control:8080
      INFERENCE_AUTH_MODE: jwt
      JWT_PUBLIC_KEY_PATH: /run/identity/public.pem
      JWT_ISSUER: https://local.inference.platform
      JWT_AUDIENCE: inference-gateway
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    volumes:
      - "./.local/agent-tools:/agent-tools"
      - "./.local/identity/public.pem:/run/identity/public.pem:ro"
    depends_on:
      redis: {condition: service_healthy}
      remediation-control: {condition: service_healthy}
      otel-collector: {condition: service_started}
    ports: ["8085:8080"]
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8080/healthz\")'"]
      interval: 3s
      timeout: 3s
      retries: 30

  gateway-1:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    command: ["uvicorn", "inference_gateway.api.main:app", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      INFERENCE_TARGET_V1_URL: http://runtime-v1:8000
      INFERENCE_TARGET_V2_URL: http://runtime-v2:8000
      REDIS_URL: redis://redis:6379/0
      INFERENCE_AUTH_MODE: jwt
      JWT_PUBLIC_KEY_PATH: /run/identity/public.pem
      JWT_ISSUER: https://local.inference.platform
      JWT_AUDIENCE: inference-gateway
      INFERENCE_QUEUE_CAPACITY: "2"
      INFERENCE_QUEUE_WAIT_SECONDS: "0.10"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    volumes: ["./.local/identity/public.pem:/run/identity/public.pem:ro"]
    depends_on:
      redis: {condition: service_healthy}
      runtime-v1: {condition: service_healthy}
      runtime-v2: {condition: service_healthy}
      otel-collector: {condition: service_started}
    ports: ["8081:8080"]
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8080/healthz\")'"]
      interval: 3s
      timeout: 3s
      retries: 20

  gateway-2:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    command: ["uvicorn", "inference_gateway.api.main:app", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      INFERENCE_TARGET_V1_URL: http://runtime-v1:8000
      INFERENCE_TARGET_V2_URL: http://runtime-v2:8000
      REDIS_URL: redis://redis:6379/0
      INFERENCE_AUTH_MODE: jwt
      JWT_PUBLIC_KEY_PATH: /run/identity/public.pem
      JWT_ISSUER: https://local.inference.platform
      JWT_AUDIENCE: inference-gateway
      INFERENCE_QUEUE_CAPACITY: "2"
      INFERENCE_QUEUE_WAIT_SECONDS: "0.10"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    volumes: ["./.local/identity/public.pem:/run/identity/public.pem:ro"]
    depends_on:
      redis: {condition: service_healthy}
      runtime-v1: {condition: service_healthy}
      runtime-v2: {condition: service_healthy}
      otel-collector: {condition: service_started}
    ports: ["8082:8080"]
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8080/healthz\")'"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  inference-redis:
    name: multi-tenant-ai-inference-platform-redis
  inference-prometheus:
    name: multi-tenant-ai-inference-platform-prometheus
  inference-grafana:
    name: multi-tenant-ai-inference-platform-grafana
