name: multi-tenant-ai-inference-platform-gpu

services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  vllm:
    image: ${VLLM_IMAGE:?set VLLM_IMAGE to an immutable image digest}
    command:
      - --model
      - ${GPU_MODEL_ID:?set GPU_MODEL_ID}
      - --revision
      - ${GPU_MODEL_REVISION:?set GPU_MODEL_REVISION}
      - --served-model-name
      - ${GPU_SERVED_MODEL_NAME:-gpu-default}
      - --dtype
      - bfloat16
      - --max-model-len
      - "8192"
      - --max-num-seqs
      - "2"
      - --max-num-batched-tokens
      - "8192"
      - --gpu-memory-utilization
      - "0.85"
      - --tensor-parallel-size
      - "1"
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      HF_HOME: /root/.cache/huggingface
    volumes:
      - model-cache:/root/.cache/huggingface
    shm_size: 8gb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      start_period: 180s
      retries: 30
    restart: unless-stopped

  gateway-1:
    build:
      context: ../..
      dockerfile: gateway/Dockerfile
    command: ["uvicorn", "inference_gateway.api.main:app", "--host", "0.0.0.0", "--port", "8080"]
    environment: &gateway-environment
      INFERENCE_VLLM_URL: http://vllm:8000
      INFERENCE_GPU_MODEL_ID: ${GPU_SERVED_MODEL_NAME:-gpu-default}
      INFERENCE_GPU_POOL: single-l4-logical
      SIMULATED_GPU_POOL: single-l4-logical
      SIMULATED_GPU_POOL_SLOTS: "2"
      SIMULATED_GPU_QUEUE_CAPACITY: "2"
      SIMULATED_GPU_QUEUE_WAIT_SECONDS: "1.0"
      REDIS_URL: redis://redis:6379/0
      INFERENCE_AUTH_MODE: jwt
      JWT_PUBLIC_KEY_PATH: /run/identity/public.pem
      JWT_ISSUER: https://local.inference.platform
      JWT_AUDIENCE: inference-gateway
      INFERENCE_QUEUE_CAPACITY: "2"
      INFERENCE_QUEUE_WAIT_SECONDS: "1.0"
      INFERENCE_BACKEND_TIMEOUT_SECONDS: "120"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    volumes:
      - ../../.local/identity/public.pem:/run/identity/public.pem:ro
    depends_on:
      redis:
        condition: service_healthy
      vllm:
        condition: service_healthy
      otel-collector:
        condition: service_started
    ports:
      - 127.0.0.1:8081:8080
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  gateway-2:
    build:
      context: ../..
      dockerfile: gateway/Dockerfile
    command: ["uvicorn", "inference_gateway.api.main:app", "--host", "0.0.0.0", "--port", "8080"]
    environment: *gateway-environment
    volumes:
      - ../../.local/identity/public.pem:/run/identity/public.pem:ro
    depends_on:
      redis:
        condition: service_healthy
      vllm:
        condition: service_healthy
      otel-collector:
        condition: service_started
    ports:
      - 127.0.0.1:8082:8080
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:4.7.0-4.9.0@sha256:2490e1dfb5baaee6765ef2841813af7d978bb459a566c22c326a8fc27c64eea9
    command: ["--collectors", "/etc/dcgm-exporter/l4-metrics.csv", "--collect-interval", "5000"]
    volumes:
      - ./dcgm-l4-metrics.csv:/etc/dcgm-exporter/l4-metrics.csv:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    expose: [9400]
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter@sha256:2c0cdc2452096b5af460d870e72fa6ee2ebb971780f443a616885685d2c0ebad
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    expose: [9121]
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/containerd/.+)($|/)
    volumes:
      - /:/host:ro,rslave
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
      - --storage.tsdb.retention.size=300MB
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
    tmpfs: ["/prometheus:size=384m,uid=65534,gid=65534"]
    ports: [127.0.0.1:9090:9090]
    depends_on: [dcgm-exporter, node-exporter, redis-exporter]
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager@sha256:e638797febd034838eca8b98cdbd46f951e9bf7f178777aa8669167406a9946c
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    tmpfs: ["/alertmanager:size=16m,uid=65534,gid=65534"]
    ports: [127.0.0.1:9093:9093]
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib@sha256:3e18fe04181de50bdd72e23ad4a4d6214b54351e63d496f1c58127cc4541ad7f
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on: [tempo]
    restart: unless-stopped

  tempo:
    image: grafana/tempo@sha256:64e2fbd56d9c2b3412a4b430a58ea59e91a670b1e75f920a0c702213ad145044
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
    tmpfs: ["/var/tempo:size=128m,uid=10001,gid=10001"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana@sha256:81556409ba48b2b922e0adb69a2511337d8ba7578f11962eefa6149a2d815101
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD before starting the GPU profile}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ../../dashboards/gpu-inference.json:/var/lib/grafana/dashboards/gpu-inference.json:ro
    tmpfs: ["/var/lib/grafana:size=64m,uid=472,gid=0"]
    ports: [127.0.0.1:3002:3000]
    depends_on: [prometheus]
    restart: unless-stopped

volumes:
  model-cache:
    name: multi-tenant-ai-inference-platform-gpu-model-cache
  redis-data:
    name: multi-tenant-ai-inference-platform-gpu-redis
