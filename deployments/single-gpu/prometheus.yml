global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: vllm
    static_configs:
      - targets: [vllm:8000]
  - job_name: inference-gateways
    static_configs:
      - targets: [gateway-1:8080, gateway-2:8080]
  - job_name: redis
    static_configs:
      - targets: [redis-exporter:9121]
  - job_name: dcgm
    static_configs:
      - targets: [dcgm-exporter:9400]
  - job_name: node
    static_configs:
      - targets: [host.docker.internal:9100]
