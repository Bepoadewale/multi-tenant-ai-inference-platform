[project]
name = "multi-tenant-ai-inference-platform"
version = "0.1.0"
description = "Governed multi-tenant inference-as-a-service platform"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "httpx>=0.28,<1", "numpy>=2.0,<3", "onnx>=1.17,<2", "onnxruntime>=1.20,<2", "opentelemetry-api>=1.29,<2", "opentelemetry-exporter-otlp-proto-http>=1.29,<2", "opentelemetry-instrumentation-fastapi>=0.50b0,<1", "opentelemetry-instrumentation-httpx>=0.50b0,<1", "opentelemetry-sdk>=1.29,<2", "prometheus-client>=0.21,<1", "pydantic>=2.9,<3", "PyJWT[crypto]>=2.10,<3", "redis>=5.2,<7", "typer>=0.12,<1", "uvicorn[standard]>=0.30,<1"]

[project.optional-dependencies]
dev = ["pip-audit>=2.8,<3", "pytest>=9.0.3,<10", "ruff>=0.8,<1"]

[project.scripts]
inferctl = "inference_gateway.cli:app"

[tool.setuptools]
package-dir = {"" = "gateway/src"}

[tool.setuptools.packages.find]
where = ["gateway/src"]

[tool.pytest.ini_options]
pythonpath = ["gateway/src"]
testpaths = ["gateway/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]
